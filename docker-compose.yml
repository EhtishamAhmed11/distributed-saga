version: '3.8'

services:
  # --- Databases ---
  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: order_db
    volumes:
      - order-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - distributed-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  saga-db:
    image: postgres:15-alpine
    container_name: saga-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: saga_db
    volumes:
      - saga-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks:
      - distributed-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saga_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:15-alpine
    container_name: inventory-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inventory_db
    volumes:
      - inventory-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - distributed-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payment_db
    volumes:
      - payment-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - distributed-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  shipping-db:
    image: postgres:15-alpine
    container_name: shipping-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shipping_db
    volumes:
      - shipping-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - distributed-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shipping_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Message Broker (Isolated Saga Names) ---
  saga-zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: saga-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - distributed-network

  saga-kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: saga-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: saga-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://saga-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - saga-zookeeper
    networks:
      - distributed-network

  # --- Application Services ---
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "3000:3000"
    volumes:
      - ./order-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@order-db:5432/order_db
      - KAFKA_BOOTSTRAP_SERVERS=saga-kafka:29092
    depends_on:
      order-db:
        condition: service_healthy
      saga-kafka:
        condition: service_started
    networks:
      - distributed-network

  saga-service:
    build:
      context: ./saga-service
      dockerfile: Dockerfile
    container_name: saga-service
    ports:
      - "3001:3001"
    volumes:
      - ./saga-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@saga-db:5432/saga_db
      - KAFKA_BOOTSTRAP_SERVERS=saga-kafka:29092
    depends_on:
      saga-db:
        condition: service_healthy
      saga-kafka:
        condition: service_started
    networks:
      - distributed-network

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "3002:3002"
    volumes:
      - ./inventory-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3002
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inventory-db:5432/inventory_db
      - KAFKA_BOOTSTRAP_SERVERS=saga-kafka:29092
    depends_on:
      inventory-db:
        condition: service_healthy
      saga-kafka:
        condition: service_started
    networks:
      - distributed-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "3003:3003"
    volumes:
      - ./payment-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3003
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@payment-db:5432/payment_db
      - KAFKA_BOOTSTRAP_SERVERS=saga-kafka:29092
    depends_on:
      payment-db:
        condition: service_healthy
      saga-kafka:
        condition: service_started
    networks:
      - distributed-network

  shipping-service:
    build:
      context: ./shipping-service
      dockerfile: Dockerfile
    container_name: shipping-service
    ports:
      - "3004:3004"
    volumes:
      - ./shipping-service:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3004
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shipping-db:5432/shipping_db
      - KAFKA_BOOTSTRAP_SERVERS=saga-kafka:29092
    depends_on:
      shipping-db:
        condition: service_healthy
      saga-kafka:
        condition: service_started
    networks:
      - distributed-network

volumes:
  order-data:
  saga-data:
  inventory-data:
  payment-data:
  shipping-data:

networks:
  distributed-network:
    name: distributed-network
    driver: bridge
